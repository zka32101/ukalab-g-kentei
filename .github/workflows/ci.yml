name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: 問題データの検証（出典必須・ID重複・正解一意性など）
        run: dart run yourwish_kentei:validate_content assets/exam/g_kentei.json assets/questions/g_kentei.jsonl
