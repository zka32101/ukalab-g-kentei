name: ukalab_g_kentei
description: "うかラボ G検定 - JDLA G検定（ジェネラリスト検定）対策アプリ。JDLAとは無関係の非公式アプリ。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # うかラボ共通基盤（コミット固定。main は参照しない。タグpushがこの環境の
  # 権限では使えないため、不変の参照としてマージコミットのSHAを直接指定する）
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: b3e37c864f574bcf7b5e7fedd7a7af8479920bc1 # v0.8.0: 画像認識の中身を見る(ConvLabWidget)
  yourwish_kentei:
    git:
      url: https://github.com/zka32101/yourwish_kentei.git
      ref: cfca5ebd0b2418b674f3d8d60ec2bf7e3ae6f67a # v0.10.0: 画像認識の中身を見る(ConvLabImage)のモデル・配信前検証

  # 状態管理
  flutter_riverpod: ">=2.5.1 <3.0.0"

  # 進捗・コインの端末内保存
  shared_preferences: ">=2.3.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exam/
    - assets/questions/
    - assets/terms/
    - assets/experience/
